<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyaanix Learning Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>Gyaanix Learning Dashboard</h1>
  <div class="search"><input id="search" placeholder="Search schools, classes, subjects or topics..." autocomplete="off"></div>
  <div class="presence" id="presence" title="Students currently active">
    <span class="dot"></span><span id="onlineCount">–</span> online
  </div>
  <button class="iconbtn" id="activityToggle" title="Live activity feed">🔔</button>
  <button class="iconbtn" id="theme" title="Toggle theme">☾</button>
</header>

<main>
  <div class="breadcrumb" id="breadcrumb"></div>
  <section class="hero">
    <h2 id="title">Schools</h2>
    <p id="subtitle">Select a school to explore its classes, subjects and learning topics.</p>
  </section>
  <div class="toolbar">
    <button class="back" id="back" hidden>← Back</button>
    <div class="stats" id="stats"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<aside class="activity-panel" id="activityPanel" hidden>
  <div class="activity-head">
    <h3>Live activity</h3>
    <button class="iconbtn" id="activityClose">✕</button>
  </div>
  <ul class="activity-list" id="activityList"></ul>
</aside>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="icon modal-icon">🔬</div>
    <h3 id="modalTitle"></h3>
    <p id="modalDesc" class="muted"></p>
    <div class="progress"><span id="modalProgressBar" style="width:0%"></span></div>
    <div class="modal-progress-label"><span id="modalProgressLabel">0%</span> complete · updates live for everyone viewing this topic</div>
    <div class="modal-actions">
      <button class="btn" id="modalAdvance">Simulate progress (+10%)</button>
      <button class="btn ghost" id="modalLaunch">Open simulation</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
